name: Gauntlet

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Verify Gauntlet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check install manifest
        run: python3 scripts/generate-install-manifest.py --check

      - name: Install Python quality tools
        run: python3 -m pip install '.[dev]'

      - name: Check Python quality
        run: |
          python3 -m ruff check .
          python3 -m pyright

      - name: Run policy checks
        run: python3 scripts/check-gauntlet-workflow.py --group policy

      - name: Run install checks
        run: python3 scripts/check-gauntlet-workflow.py --group install

      - name: Run contract checks
        run: python3 scripts/check-gauntlet-workflow.py --group contracts

      - name: Run eval checks
        run: python3 scripts/check-gauntlet-workflow.py --group evals
